services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: poslite
      POSTGRES_PASSWORD: poslite
      POSTGRES_DB: poslite
    ports: ["5433:5432"]  # 5433: avoid clashing with a locally installed Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poslite"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
