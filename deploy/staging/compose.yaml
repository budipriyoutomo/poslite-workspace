# POSLite staging on one VPS: API + worker + PostgreSQL + Redis behind Caddy (HTTPS).
# The POS PWA, the back-office and the operator console run on Vercel. Runbook: deploy/staging/README.md.
#
#   cd deploy/staging && cp .env.example .env   # fill in, then:
#   docker compose up -d --build

x-api-env: &api-env
  # ADR-013: three roles — the API runs as poslite_app (RLS enforced), migrations as the owner,
  # token lookup and the outbox relay as poslite_system.
  DATABASE_URL: postgresql+asyncpg://poslite_app:${APP_DB_PASSWORD:?}@postgres:5432/poslite
  MIGRATION_DATABASE_URL: postgresql+asyncpg://poslite:${OWNER_DB_PASSWORD:?}@postgres:5432/poslite
  SYSTEM_DATABASE_URL: postgresql+asyncpg://poslite_system:${SYSTEM_DB_PASSWORD:?}@postgres:5432/poslite
  REDIS_URL: redis://redis:6379/0
  PUBLIC_API_URL: https://${API_DOMAIN:?}
  CORS_ORIGINS: '["https://${POS_DOMAIN:?}","https://${ADMIN_DOMAIN:?}","https://${OPERATOR_DOMAIN:?}"]'
  MIN_APP_VERSION: ${MIN_APP_VERSION:-0.0.0}
  PAYMENT_GATEWAY: fake
  GATEWAY_SECRET: ${GATEWAY_SECRET:?}
  PRICE_PER_OUTLET: ${PRICE_PER_OUTLET:-150000}
  MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
  MEDIA_LOCAL_DIR: /app/var/media
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_REGION: ${S3_REGION:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_OBJECT_ACL: ${S3_OBJECT_ACL:-public-read}

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:?}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "poslite"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  # poslite-api is always built on the VPS from ../../poslite-api, never pulled from a registry:
  # migrate builds the image, api and worker reuse that local image (pull_policy: never).
  migrate:
    build: ../../poslite-api
    image: poslite-api:staging
    pull_policy: build
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
    logging: *logging

  api:
    image: poslite-api:staging
    pull_policy: never
    restart: unless-stopped
    environment: *api-env
    volumes:
      - media:/app/var/media
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Outbox relay → reports & outgoing webhooks every few seconds, daily billing (ADR-012, ADR-018).
  worker:
    image: poslite-api:staging
    pull_policy: never
    restart: unless-stopped
    command: ["arq", "poslite.worker.WorkerSettings"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

volumes:
  postgres:
  media:
  caddy_data:
  caddy_config:
