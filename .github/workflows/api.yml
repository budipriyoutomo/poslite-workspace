name: API

on:
  push:
    branches: [main]
    paths: [poslite-api/**, .github/workflows/api.yml]
  pull_request:
    paths: [poslite-api/**, .github/workflows/api.yml]

defaults:
  run:
    working-directory: poslite-api

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: poslite-api
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run lint-imports
      # When tests/integration lands: add a postgres service and set TEST_DATABASE_URL.
      - run: uv run pytest --cov --cov-fail-under=85
