name: Print Bridge

on:
  push:
    branches: [main]
    paths: [poslite-print-bridge/**, .github/workflows/bridge.yml]
  pull_request:
    paths: [poslite-print-bridge/**, .github/workflows/bridge.yml]

defaults:
  run:
    working-directory: poslite-print-bridge

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: poslite-print-bridge/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: poslite-print-bridge/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
